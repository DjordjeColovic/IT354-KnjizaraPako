<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pako | Registracija</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="zaglavlje" id="zaglavlje"></header>

  <main>
    <div class="obrazac">
      <div id="poruka" class="poruka sakriveno"></div>
      <div class="kartica">
        <h1>Registracija</h1>
        <form id="forma-registracija" novalidate>
          <div class="polja-red">
            <div class="polje">
              <label for="ime">Ime</label>
              <input type="text" id="ime" autocomplete="given-name">
            </div>
            <div class="polje">
              <label for="prezime">Prezime</label>
              <input type="text" id="prezime" autocomplete="family-name">
            </div>
          </div>
          <div class="polje">
            <label for="email">Email adresa</label>
            <input type="email" id="email" autocomplete="email">
          </div>
          <div class="polje">
            <label for="telefon">Telefon</label>
            <input type="tel" id="telefon" placeholder="06xxxxxxxx" autocomplete="tel">
          </div>
          <div class="polja-red">
            <div class="polje">
              <label for="adresa">Adresa</label>
              <input type="text" id="adresa" autocomplete="street-address">
            </div>
            <div class="polje">
              <label for="grad">Grad</label>
              <input type="text" id="grad" autocomplete="address-level2">
            </div>
          </div>
          <div class="polje">
            <label for="lozinka">Lozinka</label>
            <input type="password" id="lozinka" autocomplete="new-password">
          </div>
          <div class="polje">
            <label for="potvrda">Potvrda lozinke</label>
            <input type="password" id="potvrda" autocomplete="new-password">
          </div>
          <div class="obrazac-dno">
            <button type="submit" class="dugme">Napravi nalog</button>
            <span>Već imate nalog? <a href="prijava.html">Prijavite se</a></span>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="podnozje">Pako knjižara · IT354 Veb sistemi 1 · 2026</footer>

  <script src="js/api.js"></script>
  <script src="js/sesija.js"></script>
  <script src="js/zajednicko.js"></script>
  <script src="js/registracija.js"></script>
</body>
</html>
